services:
  cms:
    image: ghcr.io/donaldedwin/brian-cms:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1337:1337"
    volumes:
      - cms-data:/opt/app/.tmp
      - cms-uploads:/opt/app/public/uploads
    env_file:
      - ./cms.env
    environment:
      NODE_ENV: production

  frontend:
    image: ghcr.io/donaldedwin/brian-frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NUXT_STRAPI_URL: http://cms:1337
      NUXT_PUBLIC_STRAPI_URL: http://cms.briangakere.com
    depends_on:
      - cms

volumes:
  cms-data:
  cms-uploads:
